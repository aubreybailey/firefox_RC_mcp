name: Release
# Push a tag matching the manifest version (e.g. v0.2.2) to sign the extension
# on AMO (unlisted) and attach the .xpi to a GitHub Release.
# Needs repo secrets WEB_EXT_API_KEY and WEB_EXT_API_SECRET.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tag matches manifest version
        run: |
          v=$(node -p 'require("./extension/manifest.json").version')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != manifest v$v"; exit 1; }
      - name: Sign (unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: npm run sign
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.xpi --title "$GITHUB_REF_NAME" --generate-notes
